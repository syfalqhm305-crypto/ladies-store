<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>متجري</title>

<link rel="stylesheet" href="assets/style.css">

</head>

<body>

<header>
<h1>متجري ✨</h1>

<nav>
<button onclick="openCart()">🛒 السلة (<span id="cartCount">0</span>)</button>
<button onclick="track()">تتبع الطلب</button>
</nav>

</header>


<main>

<h2>المنتجات</h2>

<div id="products" class="products">

</div>


</main>



<div id="cartBox" class="popup">

<h2>سلة المشتريات</h2>

<div id="cartItems"></div>

<h3 id="total">الإجمالي: 0</h3>

<button onclick="checkout()">إتمام الطلب</button>

<button onclick="closeCart()">إغلاق</button>

</div>



<div id="orderBox" class="popup">

<h2>إتمام الطلب</h2>


<input id="name" placeholder="الاسم">

<input id="phone" placeholder="رقم التواصل">


<select id="gender">

<option value="female">أنثى</option>

<option value="male">ذكر</option>

</select>


<input id="area" placeholder="الحارة / المنطقة">

<input id="address" placeholder="العنوان">


<select id="payment">

<option>يدًا بيد</option>

<option>محفظة جيب</option>

<option>حوالة</option>

</select>


<textarea id="notes" placeholder="ملاحظات"></textarea>


<button onclick="sendOrder()">
تأكيد الطلب
</button>


</div>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/config.js"></script>

<script src="js/app.js"></script>


</body>
</html>
