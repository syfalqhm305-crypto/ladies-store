<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title data-store-name>متجري</title><link rel="stylesheet" href="assets/style.css"></head><body><div id="toast" class="toast"></div><header class="topbar"><div class="container nav"><div class="brand" data-store-name>متجري</div><div class="nav-actions"><button class="btn btn-light" id="trackTop" onclick="document.querySelector('#tracking').classList.remove('hide');document.querySelector('#store').classList.add('hide')">تتبع الطلب</button><button class="btn btn-light" id="cartBtn">السلة (<span id="cartCount">0</span>)</button></div></div></header><main class="container"><section id="store"><div class="hero"><h1>أهلاً بك في <span data-store-name>متجري</span> ✨</h1><p>اختاري ما يناسبك، أضيفيه للسلة، ثم أرسلي طلبك بسهولة.</p></div><div id="categories" class="categories"></div><div class="section-head"><h2>المنتجات</h2></div><div id="products" class="products"></div></section><section id="tracking" class="track-card hide"><button class="btn btn-light" id="shopBtn">← العودة للمتجر</button><h2>تتبع طلبك</h2><form id="trackForm"><div class="field"><label>رقم التتبع</label><input name="token" placeholder="مثال: رقم التتبع" required></div><button class="btn btn-primary" style="margin-top:10px">تتبع</button></form><div id="trackMsg" class="muted"></div><div id="trackNumber" style="margin-top:18px;font-weight:900"></div><div id="trackPay" style="margin-top:8px"></div><div id="trackSteps" class="steps"></div></section></main><div id="cartModal" class="cart-panel"><div class="drawer"><button class="btn btn-light" id="closeCart">إغلاق</button><h2>سلة المشتريات</h2><div id="cartItems"></div><div class="panel"><strong>الإجمالي: </strong><span id="cartTotal">0</span><button id="checkoutBtn" class="btn btn-primary" style="width:100%;margin-top:12px">إتمام الطلب</button></div></div></div><div id="productModal" class="modal"></div><div id="checkoutModal" class="modal"><div class="drawer"><button class="btn btn-light" onclick="closeModal('checkoutModal')">إغلاق</button><h2>إتمام الطلب</h2><form id="checkoutForm"><div class="form-grid"><div class="field"><label>الاسم</label><input name="name" required></div><div class="field"><label>رقم التواصل</label><input name="phone" required></div><div class="field full"><label>الجنس</label><div class="radio-row"><label class="radio"><input type="radio" name="gender" value="female" checked> أنثى</label><label class="radio"><input type="radio" name="gender" value="male"> ذكر</label></div></div><div class="field"><label>الحارة / المنطقة</label><input name="area"></div><div class="field"><label>العنوان</label><input name="address"></div><div class="field full"><label>طريقة الدفع</label><select name="payment_method" id="paymentMethod"><option value="cash">يدًا بيد</option><option value="jeep">محفظة جيب</option><option value="transfer">حوالة</option></select><div id="payInfo" class="pay-box"></div></div><div class="field full"><label>ملاحظات</label><textarea name="notes" rows="3"></textarea></div></div><button class="btn btn-primary" style="width:100%;margin-top:12px">تأكيد الطلب</button></form></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script>window.dispatchEvent(new Event('supabase-loaded'))</script><script src="js/supabase-client.js"></script><script src="js/store.js"></script><script>setTimeout(()=>{try{setPayInfo()}catch{}} ,500)</script></body></html>
