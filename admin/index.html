<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>لوحة التحكم</title>
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body>
  <div id="toast" class="toast"></div>

  <main class="admin-wrap">
    <div class="panel">
      <h1>لوحة تحكم المتجر</h1>

      <div id="authBox">
        <form id="loginForm">
          <div class="form-grid">
            <div class="field">
              <label>البريد</label>
              <input name="email" type="email" required>
            </div>

            <div class="field">
              <label>كلمة المرور</label>
              <input name="password" type="password" required>
            </div>
          </div>

          <button class="btn btn-primary" style="margin-top:12px">
            دخول
          </button>
        </form>
      </div>

      <div id="app" class="hide">
        <div class="side-nav">
          <button class="btn btn-primary" data-tab="dashboard">الرئيسية</button>
          <button class="btn" data-tab="products">المنتجات</button>
          <button class="btn" data-tab="orders">الطلبات</button>
          <button class="btn" data-tab="settings">الإعدادات</button>
          <button class="btn" id="logout">خروج</button>
        </div>

        <section id="dashboard" class="tab">
          <div class="admin-grid">
            <div class="stat">
              الطلبات
              <strong id="statOrders">0</strong>
            </div>

            <div class="stat">
              إجمالي المبيعات
              <strong id="statSales">0</strong>
            </div>

            <div class="stat">
              المنتجات
              <strong id="statProducts">0</strong>
            </div>

            <div class="stat">
              المعلق
              <strong id="statPending">0</strong>
            </div>
          </div>
        </section>

        <section id="products" class="tab hide">
          <div class="panel">
            <h2>إضافة منتج</h2>

            <form id="productForm">
              <div class="form-grid">
                <div class="field">
                  <label>الاسم</label>
                  <input name="name" required>
                </div>

                <div class="field">
                  <label>السعر</label>
                  <input name="price" type="number" required>
                </div>

                <div class="field">
                  <label>المخزون</label>
                  <input name="stock" type="number" value="0">
                </div>

                <div class="field">
                  <label>رابط الصورة</label>
                  <input name="image_url">
                </div>

                <div class="field">
                  <label>القسم</label>
                  <select name="category_id" id="productCategory"></select>
                </div>

                <div class="field">
                  <label>المقاسات — افصل بفاصلة</label>
                  <input name="sizes" placeholder="S,M,L,XL">
                </div>

                <div class="field">
                  <label>الألوان — افصل بفاصلة</label>
                  <input name="colors" placeholder="أسود,أبيض">
                </div>

                <div class="field full">
                  <label>الوصف</label>
                  <textarea name="description"></textarea>
                </div>
              </div>

              <button class="btn btn-primary" style="margin-top:12px">
                حفظ
              </button>
            </form>
          </div>

          <div class="table-wrap">
            <table class="table">
              <thead>
                <tr>
                  <th>الاسم</th>
                  <th>السعر</th>
                  <th>المخزون</th>
                  <th>إجراء</th>
                </tr>
              </thead>
              <tbody id="productRows"></tbody>
            </table>
          </div>
        </section>

        <section id="orders" class="tab hide">
          <div class="table-wrap">
            <table class="table">
              <thead>
                <tr>
                  <th>الطلب</th>
                  <th>العميل</th>
                  <th>الإجمالي</th>
                  <th>الدفع</th>
                  <th>الحالة</th>
                  <th>تحديث</th>
                </tr>
              </thead>
              <tbody id="orderRows"></tbody>
            </table>
          </div>
        </section>

        <section id="settings" class="tab hide">
          <form id="settingsForm" class="panel">
            <div class="form-grid">
              <div class="field">
                <label>اسم المتجر</label>
                <input name="store_name">
              </div>

              <div class="field">
                <label>العملة</label>
                <input name="currency">
              </div>

              <div class="field">
                <label>واتساب المسؤول الذكر</label>
                <input name="male_whatsapp">
              </div>

              <div class="field">
                <label>واتساب مسؤولة الإناث</label>
                <input name="female_whatsapp">
              </div>

              <div class="field">
                <label>رقم يدًا بيد</label>
                <input name="cash_contact">
              </div>

              <div class="field">
                <label>اسم مستلم جيب</label>
                <input name="jeep_name">
              </div>

              <div class="field">
                <label>رقم جيب</label>
                <input name="jeep_number">
              </div>

              <div class="field">
                <label>اسم مستلم الحوالة</label>
                <input name="transfer_name">
              </div>

              <div class="field">
                <label>رقم الحوالة</label>
                <input name="transfer_number">
              </div>
            </div>

            <button class="btn btn-primary" style="margin-top:12px">
              حفظ الإعدادات
            </button>
          </form>
        </section>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script>
    window.dispatchEvent(new Event('supabase-loaded'));
  </script>
  <script src="../js/supabase-client.js"></script>
  <script src="admin.js"></script>
</body>
</html>
